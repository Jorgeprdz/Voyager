name: FinderDex debug
on:
  push:
    branches: [feat/finder-dex-foundation-01, feat/finderdex-r3-implementation, feat/finderdex-r3.2-mobile-premium, feat/finderdex-r3.2.1-premium-polish]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finderdex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINDERDEX_OAUTH_SCHEME: ${{ vars.FINDERDEX_OAUTH_SCHEME }}
      FINDERDEX_DRIVE_CLIENT_ID: ${{ vars.FINDERDEX_DRIVE_CLIENT_ID }}
      FINDERDEX_ONEDRIVE_CLIENT_ID: ${{ vars.FINDERDEX_ONEDRIVE_CLIENT_ID }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Restore stable FinderDex debug signing key
        env:
          FINDERDEX_DEBUG_KEYSTORE_BASE64: ${{ secrets.FINDERDEX_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FINDERDEX_DEBUG_KEYSTORE_BASE64:?Stable debug signing key is required}"
          umask 077
          key_path="$RUNNER_TEMP/finderdex-debug.keystore"
          printf '%s' "$FINDERDEX_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          test -s "$key_path"
          printf 'FINDERDEX_DEBUG_KEYSTORE_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
      - name: '1/4 · Compilar app y pruebas Android'
        id: compile
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false compileDebugKotlin compileDebugAndroidTestKotlin
      - name: '2/4 · Pruebas unitarias'
        id: tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # Changed test inputs execute normally; avoid invalidating all cached Gradle tasks.
        # The XML reports, not the requested command, determine actual test execution.
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false testDebugUnitTest
      - name: '3/4 · Lint'
        id: lint
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # Collect lint findings even if tests fail, avoiding one run per kind of error.
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false lintDebug
      - name: '4/4 · Empaquetar APK debug'
        id: apk
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.lint.outcome == 'success' }}
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false assembleDebug assembleDebugAndroidTest
      - name: Verify debug APK, signing and packaged FinderDex launcher
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/aapt"
          test -x "$build_tools/apksigner"
          for apk in "${apks[@]}"; do
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
            entries="$(mktemp)"
            unzip -Z -1 "$apk" > "$entries"
            grep -qx 'AndroidManifest.xml' "$entries"
            grep -qx 'classes.dex' "$entries"
            "$build_tools/apksigner" verify --print-certs "$apk"
            badging="$(mktemp)"
            "$build_tools/aapt" dump badging "$apk" > "$badging"
            grep -q "package: name='com.finderdex.preview'" "$badging"
            resources="$(mktemp)"
            "$build_tools/aapt" dump resources "$apk" > "$resources"
            for resource in mipmap/ic_launcher mipmap/ic_launcher_round               drawable/ic_launcher_foreground drawable/ic_launcher_background               drawable/ic_launcher_monochrome drawable/finderdex_icon_art; do
              if ! grep -Fq "$resource" "$resources"; then
                echo "::error::Packaged FinderDex launcher resource missing: $resource"
                exit 1
              fi
            done
            echo "APK: $apk"
            sha256sum "$apk"
            echo "### FinderDex APK verification" >> "$GITHUB_STEP_SUMMARY"
            echo "- Package: com.finderdex.preview" >> "$GITHUB_STEP_SUMMARY"
            echo "- Signing: apksigner verified" >> "$GITHUB_STEP_SUMMARY"
            echo "- Launcher: adaptive, round, monochrome, background, foreground, artwork resources present" >> "$GITHUB_STEP_SUMMARY"
            apk_sha="$(sha256sum "$apk" | cut -d ' ' -f 1)"
            printf -- '- SHA256: `%s`\n' "$apk_sha" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$entries" "$badging" "$resources"
          done
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        with:
          name: FinderDex-${{ github.ref_name == 'feat/finderdex-r3.2.1-premium-polish' && 'R3.2.1' || (github.ref_name == 'feat/finderdex-r3.2-mobile-premium' && 'R3.2' || (github.ref_name == 'feat/finderdex-r3-implementation' && 'R3' || 'R2.2')) }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        with:
          name: FinderDex-${{ github.ref_name == 'feat/finderdex-r3.2.1-premium-polish' && 'R3.2.1' || (github.ref_name == 'feat/finderdex-r3.2-mobile-premium' && 'R3.2' || (github.ref_name == 'feat/finderdex-r3-implementation' && 'R3' || 'R2.2')) }}-Tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: FinderDex-${{ github.ref_name == 'feat/finderdex-r3.2.1-premium-polish' && 'R3.2.1' || (github.ref_name == 'feat/finderdex-r3.2-mobile-premium' && 'R3.2' || (github.ref_name == 'feat/finderdex-r3-implementation' && 'R3' || 'R2.2')) }}-verification
          path: |
            app/build/reports/
            app/build/test-results/
