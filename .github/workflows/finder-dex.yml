name: FinderDex debug
on:
  push:
    branches: [feat/finder-dex-foundation-01]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finderdex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
      FINDERDEX_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/finderdex-debug.keystore
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Restore stable FinderDex debug signing key
        env:
          FINDERDEX_DEBUG_KEYSTORE_BASE64: ${{ secrets.FINDERDEX_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FINDERDEX_DEBUG_KEYSTORE_BASE64:?Stable debug signing key is required}"
          umask 077
          printf '%s' "$FINDERDEX_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$FINDERDEX_DEBUG_KEYSTORE_PATH"
      - name: '1/4 · Compilar app y pruebas Android'
        id: compile
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false compileDebugKotlin compileDebugAndroidTestKotlin
      - name: '2/4 · Pruebas unitarias'
        id: tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # Always execute tests, including contracts which inspect source/resources directly.
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false testDebugUnitTest --rerun
      - name: '3/4 · Lint'
        id: lint
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        # Collect lint findings even if tests fail, avoiding one run per kind of error.
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false lintDebug
      - name: '4/4 · Empaquetar APK debug'
        id: apk
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.lint.outcome == 'success' }}
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        with:
          name: FinderDex-R2-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: FinderDex-verification
          path: |
            app/build/reports/
            app/build/test-results/
