name: FinderDex R2 debug APK
on:
  push:
    branches:
      - feat/finder-dex-foundation-01
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and verify FinderDex R2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
      FINDERDEX_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/finderdex-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable debug signing
        shell: bash
        env:
          FINDERDEX_DEBUG_KEYSTORE_BASE64: ${{ secrets.FINDERDEX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${FINDERDEX_DEBUG_KEYSTORE_BASE64:?Missing FinderDex signing secret}"
          umask 077
          printf '%s' "$FINDERDEX_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$FINDERDEX_DEBUG_KEYSTORE_PATH"
      - name: Compile and test
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --build-cache --max-workers=2 -Pvoyager.enableAbiSplits=false :app:assembleDebug
      - name: Publish FinderDex R2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FinderDex-R2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
